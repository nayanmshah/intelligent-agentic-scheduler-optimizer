[project]
name = "scheduling-optimizer"
version = "1.0.0"
description = "Intelligent agentic scheduling optimizer for multi-resource dental scheduling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.69"]
eval = ["numpy>=2.1"]
dev = [
    "pytest>=8.3",
    # starlette's TestClient requires httpx2; the API boundary is where untrusted
    # text arrives, so it is worth testing over real HTTP rather than by calling
    # the route functions directly.
    "httpx2>=0.1",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Strictness is enforced where correctness is load-bearing. The API and agent
# layers are checked, but not at strict level -- they are I/O adapters.
module = ["app.api.*", "app.agents.llm.*", "app.trace.opik"]
disallow_untyped_decorators = false
